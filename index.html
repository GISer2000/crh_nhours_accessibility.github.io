<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国动车时空可达性地图</title>
  <link rel="stylesheet" href="style.css">
  <!-- ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text" class="loading-text">数据加载中...</div>
  </div>

  <header class="app-header">
    <div class="brand">
      <span class="icon">🚄</span>
      <h1>全国动车时空可达性</h1>
    </div>

    <div class="controls-bar">
      <!-- 城市选择 -->
      <div class="control-group">
        <label for="city-select">出发城市</label>
        <div class="select-search-wrapper">
          <select id="city-select" class="custom-select"></select>
          <button type="button" id="city-search-btn" class="icon-btn" title="快速搜索城市">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </button>
          
          <div id="city-search-panel" class="search-panel hidden">
            <input
              id="city-search-input"
              type="text"
              placeholder="输入城市或拼音首字母..."
              autocomplete="off"
            />
            <ul id="city-search-results" class="results-list"></ul>
          </div>
        </div>
      </div>

      <!-- 时间选择 -->
      <div class="control-group">
        <label for="hour-select">最大耗时</label>
        <div class="select-wrapper">
          <select id="hour-select" class="custom-select"></select>
        </div>
      </div>

      <!-- 统计指标 -->
      <div id="status" class="status-badge">准备就绪</div>
    </div>
  </header>

  <main class="main-content">
    <div id="chart" class="chart-container"></div>
  </main>

  <script src="main.js"></script>
</body>
</html>
