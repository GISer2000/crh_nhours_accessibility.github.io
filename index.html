<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国动车可达性地图</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
  <!-- 加载遮罩 -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text" class="loading-text">数据加载中...</div>
  </div>

  <header class="toolbar">
    <div class="brand">
      <span class="icon">🚄</span>
      <h1>动车可达城市</h1>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="city-select">出发城市</label>
        <div class="select-wrapper">
          <select id="city-select"></select>
          <button type="button" id="city-search-btn" title="搜索城市">🔍</button>
          
          <div id="city-search-panel" class="search-panel hidden">
            <input
              id="city-search-input"
              type="text"
              placeholder="输入城市名或首字母"
              autocomplete="off"
            />
            <ul id="city-search-results"></ul>
          </div>
        </div>
      </div>

      <div class="control-group">
        <label for="hour-select">最大时间</label>
        <select id="hour-select"></select>
      </div>

      <span id="status" class="status"></span>
    </div>
  </header>

  <main id="chart" class="chart"></main>

  <script src="js/main.js"></script>
</body>
</html>
